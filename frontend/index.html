<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoalPath</title>
  <link rel="icon" href="assets/ball.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="hud">
    <div class="brand"><img src="assets/ball.png" alt=""> GoalPath</div>
    <div class="stats">
      <span>Goal <b id="dist">–</b> m</span>
      <span>Accuracy <b id="acc">–</b> m</span>
    </div>
    <div class="controls">
      <span id="demo-badge" class="badge" hidden>DEMO</span>
      <label class="toggle"><input type="checkbox" id="demo-toggle"> Demo</label>
      <button id="start" class="primary" disabled>Start game</button>
    </div>
  </header>

  <div id="map"></div>
  <div id="hint">Waiting for your location…</div>

  <div id="panel" class="overlay" hidden>
    <div class="card">
      <h2 id="panel-title"></h2>
      <div id="panel-body"></div>
      <div id="panel-actions" class="actions"></div>
    </div>
  </div>

  <div id="goal-overlay" class="overlay" hidden>
    <div class="card goal-card">
      <h1>GOAL!</h1>
      <p>Time <b id="goal-time"></b> · Walked <b id="goal-dist"></b> m</p>
      <div class="actions"><button id="play-again" class="primary">Play again</button></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
